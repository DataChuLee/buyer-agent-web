name: Buyer search pipeline

on:
  pull_request:
    paths:
      - ".github/workflows/buyer-search.yml"
      - "backend/Agent/product_search_agent.py"
      - "backend/Agent/seller_search_agent.py"
      - "backend/Crawling/**"
      - "backend/Tools/crawl_and_index.py"
      - "backend/Tools/crawl_registry.py"
      - "backend/Tools/seller_normalization.py"
      - "backend/Tools/seller_selection.py"
      - "backend/Tools/web_search_cache.py"
      - "backend/Test/test_cache_primitives.py"
      - "backend/Test/test_crawler_normalization.py"
      - "backend/Test/test_product_search_agent_module.py"
      - "backend/Test/test_raw_items_cache.py"
      - "backend/Test/test_redsoccer_size_extraction.py"
      - "backend/Test/test_seller_search_agent_module.py"
      - "backend/Test/test_seller_selection.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LANGCHAIN_TRACING_V2: "false"
      LANGSMITH_TRACING: "false"
      PYTHONDONTWRITEBYTECODE: "1"
      CHROMA_PERSIST_DIR: ${{ runner.temp }}/buyer-search-cache

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install search test dependencies
        run: >-
          python -m pip install
          pytest pytest-asyncio python-dotenv pandas playwright langchain-core

      - name: Run mock-only buyer search tests
        run: >-
          python -m pytest -p no:cacheprovider
          Test/test_crawler_normalization.py
          Test/test_redsoccer_size_extraction.py
          Test/test_cache_primitives.py
          Test/test_raw_items_cache.py
          Test/test_product_search_agent_module.py
          Test/test_seller_search_agent_module.py
          Test/test_seller_selection.py
